name: sharemeal
description: ShareMeal Android app with role-based screen modules and Firebase.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  firebase_database: ^13.0.1
  flutter_svg: ^2.3.2
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  file_picker: ^13.3.0
  path_provider: ^2.1.6
  pdf: ^3.13.1
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  google_maps_flutter: ^2.19.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
  assets:
    - assets/figma/
    - assets/images/
    - assets/images/food/
    - assets/icons/
    - assets/fonts/
